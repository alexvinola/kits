name: ci

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]
    tags: ['v*']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: false
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        run: go test -race ./...
      - name: Windows installer (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.Tests.ps1
      - name: Windows installer (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install.Tests.ps1

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: make cross

  # Runs when a version tag such as v0.1.0 is pushed. Afterwards, pin the
  # formula to it: scripts/bump-homebrew-formula.sh 0.1.0 Formula/kits.rb
  release:
    name: publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not a vX.Y.Z version tag"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build release binaries
        run: make cross VERSION="${GITHUB_REF_NAME#v}"
      - name: Include Windows installer
        run: cp scripts/install.ps1 dist/install.ps1
      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
